# =============================================================================
# Domain: Organization
# Entity: Position
# Description: A job position / title (reference master). Referenced as position_id
# by backbone-employee.employments (logical FK — no DB constraint).
# =============================================================================

models:
  - name: Position
    collection: positions
    description: "Job position / title (referenced as position_id by backbone-employee.employments)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique position identifier"

      name:
        type: string
        attributes: ["@required", "@max(150)"]
        description: "Position / job title"

      code:
        type: string?
        attributes: ["@max(30)"]
        description: "Short code, unique within the owning unit when provided"

      description:
        type: string?
        attributes: ["@max(1000)"]
        description: "Free-form description (responsibilities, scope)"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    # Tenancy (ADR-0029): the module is tenant-agnostic — no tenant key, no per-unit unique.
    # Positions are unit-local masters; per-unit code/name lookups are posture — the composing
    # service's tenancy decorator re-declares them org-scoped.
