# =============================================================================
# Domain: Organization
# Entity: Company
# Description: Legal entity / books owner; a company-kind node in organization.org_units.
#
# TENANT ISOLATION BOUNDARY — SETTLED (see ADR-001 §3 and ADR-003):
#   - The tenant fence is schema-per-tenant at the DB layer, enforced by RLS at the app
#     role. There is NO tenant_id/provider_id column in this module.
#   - `company_id` is NOT a tenant. It partitions the BOOKS — which legal entity owns a
#     document. The group/consolidation tree lives in organization.org_units
#     (org_units.parent_id — a company's node id IS the company id; the legacy
#     parent_company_id column is gone, a view over org_units exposes parent/subsidiary
#     pairs), and `is_default` below means a principal crosses this boundary routinely and
#     legitimately (consolidated reporting, intercompany postings), which is the opposite
#     of how an isolation fence behaves.
#   - The sapiens tenant-entity candidates (OrganizationUser/OrganizationRole/
#     OrganizationPermission) are an auth/RBAC concern owned by sapiens, not modeled here.
# Do not re-litigate either boundary in this file; supersede the ADRs instead.
# =============================================================================

models:
  - name: Company
    collection: companies
    description: "Legal entity that owns the books (a company-kind node in organization.org_units)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique company identifier"

      # Identification
      code:
        type: string
        attributes: ["@required", "@max(30)"]
        description: "Short unique code (e.g., ACME, HQ)"

      legal_name:
        type: string
        attributes: ["@required", "@max(200)"]
        description: "Registered legal name (e.g., PT Acme Indonesia)"

      trade_name:
        type: string?
        attributes: ["@max(200)"]
        description: "Trading / brand name"

      # Indonesia-first statutory identifiers
      npwp:
        type: string?
        attributes: ["@max(25)"]
        description: "Nomor Pokok Wajib Pajak (tax ID) — 15 or 16 digits"

      nib:
        type: string?
        attributes: ["@max(30)"]
        description: "Nomor Induk Berusaha (business registration number)"

      entity_type:
        type: CompanyEntityType
        attributes: ["@default(pt)"]
        description: "Indonesian legal form"

      # Accounting configuration
      base_currency:
        type: string
        attributes: ["@default('IDR')", "@length(3)"]
        description: "Functional currency (ISO 4217)"

      fiscal_year_start_month:
        type: int
        attributes: ["@default(1)", "@min(1)", "@max(12)"]
        description: "Month the fiscal year starts (1 = January)"

      # Contact / address
      email:
        type: string?
        attributes: ["@max(150)"]
        description: "Primary email"

      phone:
        type: string?
        attributes: ["@max(30)"]
        description: "Primary phone"

      address:
        type: string?
        attributes: ["@max(255)"]
        description: "Street address"

      city:
        type: string?
        attributes: ["@max(100)"]
        description: "City / kabupaten"

      province:
        type: string?
        attributes: ["@max(100)"]
        description: "Province / provinsi"

      postal_code:
        type: string?
        attributes: ["@max(10)"]
        description: "Postal code"

      country:
        type: string
        attributes: ["@default('ID')", "@length(2)"]
        description: "ISO 3166-1 alpha-2 country code"

      is_default:
        type: bool
        attributes: ["@default(false)"]
        description: "Default company for the tenant"

      status:
        type: CompanyStatus
        attributes: ["@default(active)"]
        description: "Lifecycle status"

      notes:
        type: string?
        attributes: ["@max(1000)"]
        description: "Internal notes"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    # Tenancy (ADR-0029): the companies registry carries no tenant axis BY DESIGN — it IS the
    # registry of legal entities. The group tree lives in organization.org_units
    # (org_units.parent_id; the company_subsidiaries view exposes the parent/subsidiary
    # pairs), and every per-unit master that used to hang off a company relation
    # (branches, departments, positions, levels, structures, the KBLI classification) is
    # scoping posture owned by the composing service's tenancy decorator.
    indexes:
      - type: unique
        fields: [code]
        where: "deleted_at IS NULL"
      - type: unique
        fields: [npwp]
        where: "npwp IS NOT NULL AND deleted_at IS NULL"
      - type: index
        fields: [status]

# =============================================================================
# Enums
# =============================================================================

enums:
  - name: CompanyEntityType
    description: "Indonesian legal entity forms"
    variants:
      - name: pt
        description: "Perseroan Terbatas (limited liability company)"
        default: true
      - name: cv
        description: "Commanditaire Vennootschap"
      - name: firma
        description: "Firma (partnership)"
      - name: perorangan
        description: "Sole proprietorship (usaha perorangan)"
      - name: koperasi
        description: "Cooperative"
      - name: yayasan
        description: "Foundation"
      - name: bumn
        description: "State-owned enterprise"
      - name: other
        description: "Other"

  - name: CompanyStatus
    description: "Company lifecycle status"
    variants:
      - name: active
        description: "Active"
        default: true
      - name: inactive
        description: "Inactive (no new activity)"
      - name: suspended
        description: "Suspended"
      - name: dissolved
        description: "Dissolved / closed"
