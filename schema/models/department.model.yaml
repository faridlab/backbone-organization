# =============================================================================
# Domain: Organization
# Entity: Department
# Description: A hierarchical org unit under a Company. Referenced as department_id (an
# accounting dimension) across the ERP.
# =============================================================================

models:
  - name: Department
    collection: departments
    description: "Hierarchical org unit under a Company (referenced as department_id dimension)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique department identifier"

      code:
        type: string
        attributes: ["@required", "@max(30)"]
        description: "Short code, unique within the owning unit"

      name:
        type: string
        attributes: ["@required", "@max(150)"]
        description: "Department name"

      # Hierarchy (tree)
      parent_id:
        type: uuid?
        attributes: ["@foreign_key(Department.id)"]
        description: "Parent department"

      level:
        type: int
        attributes: ["@default(0)", "@non_negative"]
        description: "Hierarchy level (0 = top)"

      is_group:
        type: bool
        attributes: ["@default(false)"]
        description: "Group node (cannot own transactions directly)"

      # Optional links
      branch_id:
        type: uuid?
        attributes: ["@foreign_key(Branch.id)"]
        description: "Branch this department is located at"

      manager_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Department manager # logical FK employee.Employee.id (one id space: employments.direct_manager_id carries an employee id too; approver resolution never converts)"

      sort_order:
        type: int
        attributes: ["@default(0)"]
        description: "Display order"

      status:
        type: OrgStatus
        attributes: ["@default(active)"]
        description: "Lifecycle status"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    relations:
      parent:
        type: Department?
        attributes: ["@one", "@foreign_key(parent_id)"]
        description: "Parent department"
        inverse: children

      children:
        type: Department[]
        attributes: ["@one_to_many"]
        description: "Child departments"
        inverse: parent

      branch:
        type: Branch?
        attributes: ["@one", "@foreign_key(branch_id)"]
        description: "Branch location"
        inverse: departments

    # Tenancy (ADR-0029): the module is tenant-agnostic — no tenant key, no per-unit unique.
    # Per-unit code/status lookups are posture — the composing service's tenancy decorator
    # re-declares them org-scoped. The parent/children hierarchy above is DOMAIN, not posture.
