# =============================================================================
# Organization Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Foundation org structure — Company (books owner), Branch, Department.
# The entities every other pillar references (accounting/branch_id/department_id
# are logical FKs to organization.Branch/Department; the org tree itself is
# organization.org_units).
# =============================================================================

module: organization
version: 2
schema: organization
# Tenancy: none, by design (ADR-0029). The module is tenant-agnostic — it ships no
# scoping column and no fence declaration; the module-native shared-tree fence and
# its company_subtree() helper are retired by the strip migration. A composing
# backend-service that wants the per-unit masters (branches, departments, levels,
# positions, structures, the KBLI classification) org-scoped declares them in its
# tenancy.yaml; the decorator installs org_unit_id, the RLS policy, the kind guard,
# and per-unit uniques at composition time. companies, industries and org_units
# carry no tenant axis at all — they ARE the registry / a public classification /
# the scoping tree — and stay intentionally unfenced under any declaration.
description: "Foundation org structure: Company (books owner), Branch, Department (Indonesia-first)"

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (managers, actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

imports:
  - company.model.yaml
  - org_unit.model.yaml
  - branch.model.yaml
  - department.model.yaml
  - industry.model.yaml
  - company_industry.model.yaml
  # Phase 0 / org-readiness — reference masters consumed by
  # backbone-employee.employments (position_id/level_id), backbone-calendar,
  # and backbone-schedule.schedule_organizations.structure_id.
  - position.model.yaml
  - level.model.yaml
  - structure.model.yaml
