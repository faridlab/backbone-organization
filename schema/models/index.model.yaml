# =============================================================================
# Organization Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Foundation org structure — Company (books owner), Branch, Department.
# The entities every other pillar references (accounting.company_id/branch_id/department_id
# are logical FKs to organization.Company/Branch/Department).
# =============================================================================

module: organization
version: 2
schema: organization
# ADR-0014 fence posture: shared_tree — a session rooted at a company sees this
# module's rows for the company's whole SUBTREE (via organization.company_subtree()
# over companies(parent_company_id)), not just its own company_id. Chosen over
# strict because the org tree is inherently hierarchical: multi-company groups
# are the norm, and a parent company's admins manage descendants' branches/
# departments/structures (recurring-themes C2/C3). companies and industries
# carry no company_id — they ARE the tree / a public classification (Odoo base
# posture) — and stay intentionally unfenced under any declaration.
company_fence: shared_tree
description: "Foundation org structure: Company (books owner), Branch, Department (Indonesia-first)"

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (managers, actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

imports:
  - company.model.yaml
  - branch.model.yaml
  - department.model.yaml
  - industry.model.yaml
  - company_industry.model.yaml
  # Phase 0 / org-readiness — reference masters consumed by
  # backbone-employee.employments (position_id/level_id), backbone-calendar,
  # and backbone-schedule.schedule_organizations.structure_id.
  - position.model.yaml
  - level.model.yaml
  - structure.model.yaml
